[package]
name = "cc-remote-desktop"
version = "0.1.0"
description = "CC Remote desktop app"
edition = "2021"
license = "MIT"
publish = false

[lib]
name = "cc_remote_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-window-state = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "sync", "time", "process", "macros"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
reqwest = { version = "0.12", default-features = false, features = ["native-tls", "http2", "charset", "gzip"] }
tokio-tungstenite = { version = "0.24", features = ["native-tls"] }
percent-encoding = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

[dev-dependencies]
tauri = { version = "2", features = ["test"] }
