[package]
name = "cc-remote-tray"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[dependencies]
windui = { git = "https://github.com/huanfeng/wind-ui-rust", rev = "6715aa4d11d6d95044dbec3a9b50c748cbd223fb", default-features = false }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "native-tls", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
