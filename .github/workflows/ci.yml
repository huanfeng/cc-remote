name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Non-interactive corepack: download the pinned pnpm on first use.
env:
  COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod # honors the toolchain directive
          check-latest: true

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false # pnpm is enabled via corepack afterwards

      # pnpm version comes from packageManager in web/package.json; corepack ships
      # with Node, so no third-party action is needed.
      - name: Enable pnpm via corepack
        working-directory: web
        run: corepack enable

      - name: Install web dependencies
        working-directory: web
        run: pnpm install --frozen-lockfile

      - name: Typecheck web
        working-directory: web
        run: pnpm run typecheck

      - name: Build web (embedded into the Go binary)
        working-directory: web
        run: pnpm run build

      - name: Build the standalone frontend
        working-directory: web
        run: pnpm run build:standalone

      - name: Web unit tests
        working-directory: web
        shell: bash
        run: node --test tests/*.test.mjs

      - name: go vet
        run: go vet ./...

      # -race needs cgo; both runner images ship a C compiler.
      - name: go test -race
        env:
          CGO_ENABLED: "1"
        run: go test -race ./...

  cross-build:
    name: cross-build (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: darwin
            goarch: arm64
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod # honors the toolchain directive
          check-latest: true

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false # pnpm is enabled via corepack afterwards

      # pnpm version comes from packageManager in web/package.json; corepack ships
      # with Node, so no third-party action is needed.
      - name: Enable pnpm via corepack
        working-directory: web
        run: corepack enable

      - name: Build web
        working-directory: web
        run: |
          pnpm install --frozen-lockfile
          pnpm run build

      - name: CGO_ENABLED=0 go build
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: go build -trimpath -o /dev/null ./cmd/cc-remote

  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true

      # The web UI is embedded with go:embed; an empty placeholder is enough
      # for analysis.
      - name: Placeholder web build
        run: mkdir -p web/dist && touch web/dist/index.html

      # Fails (exit 3) when a vulnerability is reachable from this code,
      # including standard library ones fixed by a newer toolchain.
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
