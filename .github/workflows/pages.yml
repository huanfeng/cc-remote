name: Pages

# The standalone web frontend on GitHub Pages (https://<owner>.github.io/<repo>/).
# Release calls this for every stable version; run it by hand to publish a ref
# again. Pages must use "GitHub Actions" as its source, and the github-pages
# environment must allow v* tags (see docs/standalone.md).
on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

# Non-interactive corepack: download the pinned pnpm on first use.
env:
  COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false # pnpm is enabled via corepack afterwards
      - name: Enable pnpm via corepack
        working-directory: web
        run: corepack enable
      - working-directory: web
        run: pnpm install --frozen-lockfile
      - working-directory: web
        run: pnpm run build:standalone
      - uses: actions/upload-pages-artifact@v5
        with:
          path: web/dist-standalone

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
