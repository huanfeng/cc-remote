name: Native Windows

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      artifact-name:
        required: false
        type: string
        default: native-windows-amd64
      updater-enabled:
        required: false
        type: boolean
        default: false
    secrets:
      TAURI_SIGNING_PRIVATE_KEY:
        required: false
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD:
        required: false

permissions:
  contents: read

env:
  COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Desktop with built-in tray (Windows x64)
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      VERSION: ${{ inputs.version }}
      CC_REMOTE_VERSION: v${{ inputs.version }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false
      - name: Enable pnpm
        run: corepack enable
      # Corepack chooses the version before pnpm processes --dir, so run in
      # each package directory to honor its pinned packageManager version.
      - name: Install web dependencies
        working-directory: web
        run: pnpm install --frozen-lockfile
      - name: Install desktop dependencies
        working-directory: desktop
        run: pnpm install --frozen-lockfile
      - name: Select Rust toolchain
        run: rustup default stable-msvc
      - name: Test and stamp release versions
        run: |
          node --test scripts/tests/*.test.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/native-version.mjs $env:VERSION
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Configure signed desktop updates
        if: inputs.updater-enabled
        env:
          TAURI_UPDATER_PUBLIC_KEY: ${{ vars.TAURI_UPDATER_PUBLIC_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY)) { throw 'Set the TAURI_SIGNING_PRIVATE_KEY repository secret before releasing' }
          node scripts/desktop-updater.mjs config desktop/src-tauri/updater.release.json $env:GITHUB_REPOSITORY
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build frontend for native tests and backend
        working-directory: web
        run: |
          pnpm run build:desktop
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm run build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test native applications
        run: |
          cargo test --locked --manifest-path desktop/src-tauri/Cargo.toml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build backend for portable bundle
        env:
          CGO_ENABLED: "0"
          GOOS: windows
          GOARCH: amd64
        run: go build -trimpath -ldflags "-s -w -X main.version=$env:VERSION" -o dist/native/cc-remote.exe ./cmd/cc-remote
      - name: Build Tauri installer
        working-directory: desktop
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        # Invoke the CLI directly so PowerShell's pnpm.ps1 shim cannot consume
        # the -- separator intended for Cargo.
        run: |
          $configArgs = @()
          if ('${{ inputs.updater-enabled }}' -eq 'true') { $configArgs = @('--config', 'src-tauri/updater.release.json') }
          node node_modules/@tauri-apps/cli/tauri.js build --ci --bundles nsis @configArgs -- --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Package installer and portable archives
        run: ./scripts/package-native.ps1 -Version $env:VERSION -StageDir "$env:RUNNER_TEMP/native-stage" -OutputDir "$env:GITHUB_WORKSPACE/out-native" -UpdaterEnabled:('${{ inputs.updater-enabled }}' -eq 'true')
      - name: Generate desktop updater manifest
        if: inputs.updater-enabled
        run: |
          node scripts/desktop-updater.mjs manifest out-native/latest.json $env:GITHUB_REPOSITORY $env:VERSION "out-native/cc-remote-desktop_$($env:VERSION)_windows_amd64-setup.exe.sig"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.artifact-name }}
          path: out-native/*
          if-no-files-found: error
          retention-days: 7
